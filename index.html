<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K&B Wedding Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:   #1B3A6B;
      --blue:   #2E5FA3;
      --lblue:  #5B8DD9;
      --pale:   #EBF1FB;
      --white:  #ffffff;
      --cream:  #FAFAF8;
      --border: #D0DCF0;
      --gray:   #7A8FAB;
      --lgray:  #C5D0E0;
      --gold:   #C8A96A;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--cream);
      color: var(--navy);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
    }

    /* ── HERO ── */
    .floral-top {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .hero-img {
      width: 100%; max-width: 600px;
      display: block; margin: 0 auto;
      object-fit: cover;
    }

        /* ── HEADER (sticky) ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--navy);
      display: flex; align-items: center; justify-content: flex-end;
      padding: 0 1.2rem; height: 48px;
      box-shadow: 0 1px 8px rgba(27,58,107,0.2);
    }
    .header-right { display: flex; align-items: center; gap: 0.7rem; }
    #photo-count-badge { font-size: 0.6rem; letter-spacing: 0.12em; color: rgba(255,255,255,0.45); display: none; }
    #private-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6); cursor: pointer;
      font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em;
      padding: 0.3rem 0.65rem; border-radius: 1px;
      display: none; -webkit-tap-highlight-color: transparent;
      transition: border-color 0.18s, color 0.18s;
    }
    #private-btn:hover { border-color: rgba(255,255,255,0.5); color: #fff; }
    #private-btn.unlocked { color: var(--gold); border-color: var(--gold); }
    #hide-toggle-btn {
      background: transparent; border: none;
      color: rgba(255,255,255,0.45); cursor: pointer;
      display: none; padding: 0.3rem;
      -webkit-tap-highlight-color: transparent; transition: color 0.18s; line-height: 1;
    }
    #hide-toggle-btn:hover, #hide-toggle-btn.active { color: var(--gold); }
    #hide-toggle-btn svg { width: 20px; height: 20px; display: block; }

    /* ── TABS ── */
    #tabs-wrapper {
      display: none; background: var(--white);
      border-bottom: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    #tabs-wrapper::-webkit-scrollbar { display: none; }
    #tabs { display: flex; width: max-content; padding: 0 1.2rem; }
    .tab-btn {
      padding: 0.65rem 1rem; background: transparent; border: none;
      border-bottom: 2px solid transparent;
      color: var(--gray); font-family: 'DM Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.1em; cursor: pointer;
      white-space: nowrap; transition: color 0.18s, border-color 0.18s;
      -webkit-tap-highlight-color: transparent; margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--navy); }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

    /* ── PIN GATE ── */
    #pin-gate {
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 1.2rem; padding: 4rem 2rem; text-align: center;
    }
    #pin-gate.show { display: flex; }
    #pin-gate p { font-size: 0.68rem; letter-spacing: 0.15em; color: var(--gray); }
    #pin-gate-input {
      font-family: 'DM Mono', monospace; font-size: 1.4rem;
      letter-spacing: 0.5em; text-align: center; width: 120px;
      padding: 0.5rem 0.6rem; border: 1px solid var(--border);
      border-radius: 1px; outline: none; color: var(--navy); background: var(--white);
      transition: border-color 0.15s;
    }
    #pin-gate-input:focus { border-color: var(--blue); }
    #pin-gate-input.error { border-color: #c84040; animation: shake 0.3s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    #pin-gate-msg { font-size: 0.65rem; color: #c84040; letter-spacing: 0.1em; min-height: 1em; }

    /* ── STATUS ── */
    #status { text-align: center; padding: 4rem 2rem; font-size: 0.7rem; letter-spacing: 0.15em; color: var(--gray); }
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .spinner { width: 26px; height: 26px; border: 2px solid var(--lgray); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── GALLERY ── */
    #gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; background: var(--border); }

    .photo-card {
      position: relative; aspect-ratio: 1; overflow: hidden; cursor: pointer; background: var(--pale);
    }
    .photo-card .thumb {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      transition: transform 0.35s ease;
    }
    .photo-card:hover .thumb { transform: scale(1.04); }
    .photo-card .sel-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s; z-index: 5;
      background: rgba(27,58,107,0.38);
    }
    .sel-overlay svg { width: 32px; height: 32px; stroke: #fff; fill: none; stroke-width: 2.5; }
    body.hide-mode .photo-card .sel-overlay { opacity: 0; }
    body.hide-mode .photo-card.selected .sel-overlay { opacity: 1; }
    .photo-card .name-tag {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 0.5rem 0.6rem;
      background: linear-gradient(to top, rgba(27,58,107,0.6) 0%, transparent 100%);
      font-size: 0.58rem; letter-spacing: 0.07em; color: rgba(255,255,255,0.9);
      opacity: 0; transition: opacity 0.2s;
    }
    .photo-card:hover .name-tag { opacity: 1; }

    /* ── HIDE BAR ── */
    #hide-bar {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
      background: var(--white); border-top: 2px solid var(--navy);
      padding: 0.8rem 1.2rem; align-items: center; justify-content: space-between; gap: 0.6rem;
    }
    #hide-bar.show { display: flex; }
    #selected-count { font-size: 0.65rem; letter-spacing: 0.1em; color: var(--gray); }
    .bar-btn {
      padding: 0.42rem 0.9rem; font-family: 'DM Mono', monospace; font-size: 0.65rem;
      letter-spacing: 0.1em; cursor: pointer; border-radius: 1px;
      border: 1px solid var(--navy); background: transparent; color: var(--navy);
      transition: background 0.15s, color 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .bar-btn:hover { background: var(--navy); color: #fff; }
    #do-hide-btn { background: var(--navy); border-color: var(--navy); color: #fff; }
    #do-hide-btn:hover { background: var(--blue); border-color: var(--blue); }
    #do-hide-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0; background: rgba(8,15,30,0.97);
      z-index: 1000; display: none; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #lightbox.active { display: flex; }
    #lb-img-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      width: 100%; position: relative; overflow: hidden; cursor: pointer;
    }
    #lightbox-img { max-width: 92vw; max-height: 80vh; object-fit: contain; display: block; transition: opacity 0.15s; cursor: default; pointer-events: none; }
    #lb-spinner { position: absolute; width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--lblue); border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      color: #fff; width: 42px; height: 42px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 10; -webkit-tap-highlight-color: transparent; transition: background 0.18s;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.16); }
    .lb-nav svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }
    #lb-prev { left: 0.5rem; } #lb-next { right: 0.5rem; }
    #lb-top {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 0.8rem 1rem; z-index: 20; pointer-events: none;
    }
    #lb-close {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18);
      color: #fff; width: 40px; height: 40px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1rem; pointer-events: all; transition: background 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    #lb-close:hover { background: rgba(255,255,255,0.22); }
    #lb-bottom {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 1rem 1rem; gap: 0.5rem;
    }
    #lb-caption { font-size: 0.6rem; color: rgba(255,255,255,0.38); letter-spacing: 0.1em; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #lb-download {
      background: var(--blue); color: #fff; border: none;
      padding: 0.52rem 1rem; font-family: 'DM Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.12em; cursor: pointer; border-radius: 1px;
      display: flex; align-items: center; gap: 0.4rem;
      text-decoration: none; -webkit-tap-highlight-color: transparent; transition: background 0.15s;
    }
    #lb-download:hover { background: var(--navy); }
    #lb-download svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

    /* iOS hint */
    #ios-hint {
      position: fixed; bottom: 5.5rem; left: 50%; transform: translateX(-50%);
      background: rgba(8,15,30,0.92); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8); font-size: 0.64rem; letter-spacing: 0.08em;
      padding: 0.55rem 1.1rem; border-radius: 3px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s; white-space: nowrap; z-index: 2000;
    }
    #ios-hint.show { opacity: 1; }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 2.5rem 1rem 2rem;
      background: var(--white); border-top: 1px solid var(--border);
      margin-top: 2rem;
    }
    .footer-monogram {
      font-family: 'Charm', cursive; font-size: 1.6rem; color: var(--navy);
      display: block; margin-bottom: 0.5rem;
    }
    footer p { font-size: 0.6rem; letter-spacing: 0.2em; color: var(--lgray); }
    footer span { color: var(--blue); }
  </style>
</head>
<body>

<!-- FLORAL HERO -->
<div class="floral-top">
  <img class="hero-img" src="hero.jpg" alt="K&amp;B" />
</div>

<!-- STICKY HEADER -->
<header>
  <div class="header-right">
    <span id="photo-count-badge"></span>
    <button id="private-btn" onclick="openPrivateTab()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:middle;margin-right:3px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>PRIVATE
    </button>
    <button id="hide-toggle-btn" onclick="toggleHideMode()" title="ซ่อนรูปภาพ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M20 20H7L3 16l10-10 7 7-3.5 3.5"/><path d="M6.5 17.5l3-3"/><line x1="2" y1="22" x2="22" y2="22"/>
      </svg>
    </button>
  </div>
</header>

<!-- TABS -->
<div id="tabs-wrapper"><div id="tabs"></div></div>

<!-- PIN GATE -->
<div id="pin-gate">
  <p>กรอกรหัสเพื่อเข้าถึง PRIVATE</p>
  <input type="password" id="pin-gate-input" maxlength="6" placeholder="••••"
    oninput="onGatePinInput()" onkeydown="if(event.key==='Enter')submitGatePin()" />
  <div id="pin-gate-msg"></div>
</div>

<!-- STATUS -->
<div id="status">
  <div class="spinner-wrap"><div class="spinner"></div><span>LOADING</span></div>
</div>

<!-- GALLERY -->
<div id="gallery"></div>

<!-- HIDE BAR -->
<div id="hide-bar">
  <span id="selected-count">เลือก 0 รูป</span>
  <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
    <button class="bar-btn" onclick="selectAll()">เลือกทั้งหมด</button>
    <button class="bar-btn" onclick="toggleHideMode()">ยกเลิก</button>
    <button class="bar-btn" id="do-hide-btn" disabled onclick="doHide()">ซ่อน</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div id="lb-top"><button id="lb-close" onclick="closeLightbox()">✕</button></div>
  <div id="lb-img-wrap">
    <div id="lb-spinner"></div>
    <img id="lightbox-img" src="" alt="preview" />
    <button class="lb-nav" id="lb-prev" onclick="navigate(-1)">
      <svg viewBox="0 0 24 24" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="lb-nav" id="lb-next" onclick="navigate(1)">
      <svg viewBox="0 0 24 24" stroke-width="1.5"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
  </div>
  <div id="lb-bottom">
    <span id="lb-caption"></span>
    <a id="lb-download" href="#" onclick="handleDownload(event)">
      <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      บันทึกภาพ
    </a>
  </div>
</div>

<div id="ios-hint">กดรูปค้างไว้ → เลือก "บันทึกไปยังรูปภาพ"</div>

<footer>
  
  <p>WEDDING GALLERY · <span id="foot-count"></span></p>
</footer>

<script>
  const FOLDER_ID   = '1etO0sMe19Oc-AfN3E9e-3-tLm2yYiuZS';
  const API_KEY     = 'AIzaSyD1xK5oJlAVpvRpqo3xlDkfpTbt1wwuAQA';
  const PRIVATE_PIN = '3333';
  const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent);

  let allPhotos=[], hiddenIds=new Set(), photos=[], currentIndex=0;
  let privateUnlocked=false, hideMode=false, selectedIds=new Set();

  function toDateLabel(iso){
    if(!iso)return'ไม่ทราบวันที่';
    const d=new Date(iso);
    return`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
  }
  try{ const s=sessionStorage.getItem('hiddenIds'); if(s)hiddenIds=new Set(JSON.parse(s)); }catch(e){}
  function saveHidden(){ try{sessionStorage.setItem('hiddenIds',JSON.stringify([...hiddenIds]));}catch(e){} }

  async function loadGallery(){
    allPhotos=[];
    try{
      let pt='';
      do{
        const url=`https://www.googleapis.com/drive/v3/files`
          +`?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'image/'`
          +`&fields=nextPageToken,files(id,name,createdTime)&orderBy=createdTime+desc`
          +`&key=${API_KEY}&pageSize=100`+(pt?`&pageToken=${pt}`:'');
        const d=await(await fetch(url)).json();
        if(d.error)throw new Error(d.error.message);
        allPhotos.push(...(d.files||[]));
        pt=d.nextPageToken||'';
      }while(pt);
      document.getElementById('status').style.display='none';
      const vis=allPhotos.filter(p=>!hiddenIds.has(p.id)).length;
      document.getElementById('photo-count-badge').textContent=`${vis} ภาพ`;
      document.getElementById('photo-count-badge').style.display='inline';
      document.getElementById('hide-toggle-btn').style.display='inline-block';
      document.getElementById('private-btn').style.display='inline-block';
      document.getElementById('foot-count').textContent=`${allPhotos.length} PHOTOS`;
      buildTabs();
    }catch(err){
      document.getElementById('status').innerHTML=`<p style="color:#2E5FA3;letter-spacing:.1em">${err.message}</p>`;
    }
  }

  function buildTabs(){
    const vis=allPhotos.filter(p=>!hiddenIds.has(p.id));
    const days=[...new Set(vis.map(p=>toDateLabel(p.createdTime)))];
    const el=document.getElementById('tabs'); el.innerHTML='';
    days.forEach(day=>el.appendChild(makeTabBtn(day,day)));
    el.appendChild(makeTabBtn('ทั้งหมด','all'));
    document.getElementById('tabs-wrapper').style.display='block';
    showTab(days[0]||'all');
  }
  function makeTabBtn(label,key){
    const b=document.createElement('button');
    b.className='tab-btn';b.textContent=label;b.dataset.key=key;
    b.onclick=()=>showTab(key); return b;
  }
  function showTab(key){
    document.getElementById('pin-gate').classList.remove('show');
    document.getElementById('gallery').style.display='grid';
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.key===key));
    document.getElementById('private-btn').classList.remove('unlocked');
    const vis=allPhotos.filter(p=>!hiddenIds.has(p.id));
    photos=key==='all'?vis:vis.filter(p=>toDateLabel(p.createdTime)===key);
    selectedIds.clear(); updateHideBar(); renderGallery();
  }

  function openPrivateTab(){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('private-btn').classList.add('unlocked');
    document.getElementById('gallery').style.display='none';
    if(privateUnlocked){ showPrivateGallery(); }
    else{
      document.getElementById('pin-gate').classList.add('show');
      document.getElementById('pin-gate-input').value='';
      document.getElementById('pin-gate-msg').textContent='';
      setTimeout(()=>document.getElementById('pin-gate-input').focus(),100);
    }
  }
  function onGatePinInput(){
    document.getElementById('pin-gate-input').classList.remove('error');
    document.getElementById('pin-gate-msg').textContent='';
    if(document.getElementById('pin-gate-input').value.length>=4)submitGatePin();
  }
  function submitGatePin(){
    const val=document.getElementById('pin-gate-input').value;
    const inp=document.getElementById('pin-gate-input');
    if(val===PRIVATE_PIN){
      privateUnlocked=true;
      document.getElementById('pin-gate').classList.remove('show');
      showPrivateGallery();
    }else{
      inp.classList.add('error');
      document.getElementById('pin-gate-msg').textContent='รหัสไม่ถูกต้อง';
      inp.value='';
      setTimeout(()=>inp.classList.remove('error'),400);
    }
  }
  function showPrivateGallery(){
    document.getElementById('gallery').style.display='grid';
    photos=allPhotos.filter(p=>hiddenIds.has(p.id));
    selectedIds.clear(); updateHideBar(); renderGallery(true);
  }

  function renderGallery(isPrivate=false){
    const g=document.getElementById('gallery'); g.innerHTML='';
    photos.forEach((photo,idx)=>{
      const thumb=`https://drive.google.com/thumbnail?id=${photo.id}&sz=w400`;
      const card=document.createElement('div');
      card.className='photo-card'; card.dataset.id=photo.id;
      card.onclick=()=>onCardClick(idx,photo.id,isPrivate);
      const div=document.createElement('div');
      div.className='thumb'; div.dataset.src=thumb; lazyObs.observe(div);
      const ov=document.createElement('div'); ov.className='sel-overlay';
      ov.innerHTML=`<svg viewBox="0 0 24 24"><polyline points="20 6 9 12 4 18"/></svg>`;
      const nt=document.createElement('div'); nt.className='name-tag'; nt.textContent=photo.name;
      card.appendChild(div); card.appendChild(ov); card.appendChild(nt);
      g.appendChild(card);
    });
    if(!photos.length){
      g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:3rem;font-size:0.68rem;letter-spacing:.15em;color:var(--gray)">ไม่มีรูปภาพ</div>';
    }
  }
  const lazyObs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){const src=e.target.dataset.src;if(src){e.target.style.backgroundImage=`url(${src})`;delete e.target.dataset.src;}lazyObs.unobserve(e.target);}
    });
  },{rootMargin:'250px'});

  function onCardClick(idx,id,isPrivate){
    if(hideMode){
      const card=document.querySelector(`.photo-card[data-id="${id}"]`);
      if(selectedIds.has(id)){selectedIds.delete(id);card.classList.remove('selected');}
      else{selectedIds.add(id);card.classList.add('selected');}
      updateHideBar();
    }else{ openLightbox(idx); }
  }

  function toggleHideMode(){
    hideMode=!hideMode;
    document.body.classList.toggle('hide-mode',hideMode);
    document.getElementById('hide-toggle-btn').classList.toggle('active',hideMode);
    document.querySelectorAll('.photo-card').forEach(c=>c.classList.remove('selected'));
    selectedIds.clear();
    if(hideMode&&document.getElementById('private-btn').classList.contains('unlocked')){
      document.getElementById('private-btn').classList.remove('unlocked'); buildTabs();
    }
    updateHideBar();
  }
  function updateHideBar(){
    const cnt=selectedIds.size;
    document.getElementById('selected-count').textContent=`เลือก ${cnt} รูป`;
    document.getElementById('do-hide-btn').disabled=cnt===0;
    document.getElementById('hide-bar').classList.toggle('show',hideMode);
  }
  function selectAll(){
    photos.forEach(p=>{selectedIds.add(p.id);const c=document.querySelector(`.photo-card[data-id="${p.id}"]`);if(c)c.classList.add('selected');});
    updateHideBar();
  }
  function doHide(){
    const inPrivate=document.getElementById('private-btn').classList.contains('unlocked');
    selectedIds.forEach(id=>{
      if(inPrivate)hiddenIds.delete(id); else hiddenIds.add(id);
      document.querySelector(`.photo-card[data-id="${id}"]`)?.remove();
    });
    photos=photos.filter(p=>!selectedIds.has(p.id));
    selectedIds.clear(); saveHidden();
    const vis=allPhotos.filter(p=>!hiddenIds.has(p.id)).length;
    document.getElementById('photo-count-badge').textContent=`${vis} ภาพ`;
    updateHideBar(); toggleHideMode(); buildTabs();
  }

  function openLightbox(idx){ currentIndex=idx; updateLightbox(); document.getElementById('lightbox').classList.add('active'); document.body.style.overflow='hidden'; }
  function closeLightbox(){ document.getElementById('lightbox').classList.remove('active'); document.body.style.overflow=''; }
  function navigate(dir){ currentIndex=(currentIndex+dir+photos.length)%photos.length; updateLightbox(); }
  function updateLightbox(){
    const p=photos[currentIndex];
    const img=document.getElementById('lightbox-img');
    const sp=document.getElementById('lb-spinner');
    img.style.opacity='0'; sp.style.display='block';
    img.onload=img.onerror=()=>{sp.style.display='none';img.style.opacity='1';};
    img.src=`https://drive.google.com/thumbnail?id=${p.id}&sz=w1600`;
    document.getElementById('lb-caption').textContent=`${currentIndex+1} / ${photos.length}  ·  ${p.name}`;
    document.getElementById('lb-download').href=`https://drive.google.com/thumbnail?id=${p.id}&sz=w4096`;
    document.getElementById('lb-download').download=p.name;
  }
  function handleDownload(e){
    if(isIOS){
      e.preventDefault();
      const p=photos[currentIndex];
      window.open(`https://drive.google.com/thumbnail?id=${p.id}&sz=w4096`,'_blank');
      const h=document.getElementById('ios-hint'); h.classList.add('show');
      setTimeout(()=>h.classList.remove('show'),4000);
    }
  }
  let tx=0;
  document.getElementById('lb-img-wrap').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
  document.getElementById('lb-img-wrap').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)navigate(dx<0?1:-1);},{passive:true});
  document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox();});
  document.getElementById('lb-img-wrap').addEventListener('click',function(e){if(e.target===this)closeLightbox();});
  document.addEventListener('keydown',e=>{
    if(!document.getElementById('lightbox').classList.contains('active'))return;
    if(e.key==='Escape')closeLightbox();
    if(e.key==='ArrowLeft')navigate(-1);
    if(e.key==='ArrowRight')navigate(1);
  });
  loadGallery();
</script>
</body>
</html>
